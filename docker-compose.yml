services:
  db:
    image: postgres:16-alpine
    container_name: ibero-data-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ibero
      POSTGRES_PASSWORD: ibero
      POSTGRES_DB: ibero_data
    ports:
      - "5433:5432"
    volumes:
      - ibero_data_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibero"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ibero_data_postgres:
